name: Build and deploy CareHub Microservices to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy-gateway:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Gateway to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-gateway'
          publish-profile: ${{ secrets.AZURE_PUBLISH_GATEWAY }}

  deploy-auth:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Auth Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-auth'
          publish-profile: ${{ secrets.AZURE_PUBLISH_AUTH }}

  deploy-patient:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Patient Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-patient'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PATIENT }}

  deploy-doctor:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Doctor Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-doctor'
          publish-profile: ${{ secrets.AZURE_PUBLISH_DOCTOR }}

  deploy-appointment:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Appointment Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-appointment'
          publish-profile: ${{ secrets.AZURE_PUBLISH_APPOINTMENT }}

  deploy-prescription:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Prescription Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-prescription'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PRESCRIPTION }}

  deploy-billing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Billing Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-billing'
          publish-profile: ${{ secrets.AZURE_PUBLISH_BILLING }}

  deploy-metrics:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: 'Deploy Metrics Service to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carehub-metrics'
          publish-profile: ${{ secrets.AZURE_PUBLISH_METRICS }}